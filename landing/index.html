<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Iminationz — Wear Elegance. Share Kindness.</title>
  <meta name="description" content="Iminationz — where every thread tells a story of grace and kindness." />
  <meta name="theme-color" content="#c4a88c" />

  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />

  <!-- Open Graph -->
  <meta property="og:title" content="Iminationz — Wear Elegance. Share Kindness." />
  <meta property="og:description" content="Discover our latest collection, visit the store, or say hi on WhatsApp." />
  <meta property="og:image" content="logo.png" />
  <meta property="og:type" content="website" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold:      #c4a88c;
      --gold-deep: #a88865;
      --gold-soft: #e6d6c2;
      --ivory:     #fbf8f4;
      --ink:       #2a2016;
      --ink-soft:  #6b5a48;
      --white:     #ffffff;
      --shadow-lg: 0 30px 60px -20px rgba(168, 136, 101, 0.35);
      --shadow-md: 0 12px 30px -10px rgba(168, 136, 101, 0.28);
      --shadow-sm: 0 4px 14px -4px rgba(168, 136, 101, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--ivory);
      color: var(--ink);
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      -webkit-font-smoothing: antialiased;
      perspective: 1400px;
    }

    /* Layered ambient gradient background */
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: -3;
      background:
        radial-gradient(ellipse at 20% 15%, rgba(196,168,140,0.35) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 90%, rgba(196,168,140,0.28) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.6) 0%, transparent 70%),
        linear-gradient(180deg, #ffffff 0%, #fbf3ea 100%);
    }
    body::after {
      content: "";
      position: fixed; inset: 0; z-index: -2;
      background-image:
        radial-gradient(rgba(196,168,140,0.08) 1px, transparent 1px);
      background-size: 22px 22px;
      opacity: 0.6;
      pointer-events: none;
    }
    #particles { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

    /* Top bar */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: max(16px, env(safe-area-inset-top)) 20px 12px;
      z-index: 20;
      pointer-events: none;
    }
    .brand-mini { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
    .brand-mini img { width: 34px; height: 34px; border-radius: 8px; }
    .brand-mini span {
      font-family: 'Playfair Display', serif;
      font-weight: 600; font-size: 15px; letter-spacing: 0.6px;
      color: var(--ink);
    }
    .icon-btn {
      pointer-events: auto;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(196,168,140,0.35);
      display: grid; place-items: center;
      cursor: pointer; transition: all 0.25s ease;
      box-shadow: var(--shadow-sm);
    }
    .icon-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .icon-btn:active { transform: translateY(0); }
    .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: var(--ink-soft); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Hero */
    .hero {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 90px 24px 40px;
      position: relative; z-index: 1;
      transform-style: preserve-3d;
    }

    .logo-stage {
      position: relative;
      width: 240px; height: 240px;
      transform-style: preserve-3d;
      will-change: transform;
      animation: floatY 6s ease-in-out infinite;
    }
    @keyframes floatY {
      0%, 100% { translate: 0 0; }
      50%      { translate: 0 -12px; }
    }
    .logo-card {
      position: absolute; inset: 0;
      background: linear-gradient(145deg, #ffffff 0%, #f5eadd 60%, #e9d6bf 100%);
      border-radius: 32px;
      box-shadow:
        0 40px 80px -30px rgba(168, 136, 101, 0.55),
        0 20px 40px -15px rgba(168, 136, 101, 0.35),
        inset 0 1px 0 rgba(255,255,255,0.9),
        inset 0 -2px 0 rgba(168,136,101,0.15);
      display: grid; place-items: center;
      transform-style: preserve-3d;
      overflow: hidden;
    }
    .logo-card::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(115deg,
        transparent 40%,
        rgba(255,255,255,0.65) 50%,
        transparent 60%);
      transform: translateX(-100%);
      animation: sheen 5s ease-in-out infinite;
    }
    @keyframes sheen {
      0%, 60% { transform: translateX(-100%); }
      75%     { transform: translateX(100%); }
      100%    { transform: translateX(100%); }
    }
    .logo-card img {
      width: 78%; height: 78%; object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(168,136,101,0.35));
      transform: translateZ(30px);
    }

    /* Decorative rings around logo */
    .ring {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(196,168,140,0.35);
      pointer-events: none;
    }
    .ring.r1 { inset: -30px; animation: spin 30s linear infinite; }
    .ring.r2 { inset: -60px; border-style: dashed; animation: spin 45s linear reverse infinite; opacity: 0.6; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tagline {
      margin-top: 40px;
      text-align: center;
      transform-style: preserve-3d;
    }
    .brand-name {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(38px, 8vw, 64px);
      letter-spacing: 2px;
      color: var(--ink);
      line-height: 1;
      background: linear-gradient(180deg, var(--ink) 0%, var(--gold-deep) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-name .accent { color: var(--gold-deep); -webkit-text-fill-color: var(--gold-deep); }
    .tag {
      margin-top: 14px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(14px, 3.4vw, 20px);
      color: var(--ink-soft);
      letter-spacing: 0.5px;
    }
    .tag .dot { color: var(--gold-deep); margin: 0 8px; }

    .scroll-hint {
      margin-top: 46px;
      display: flex; flex-direction: column; align-items: center;
      color: var(--ink-soft); font-size: 11px;
      letter-spacing: 3px; text-transform: uppercase;
      animation: bob 2.4s ease-in-out infinite;
    }
    .scroll-hint svg { margin-top: 10px; stroke: var(--gold-deep); }
    @keyframes bob {
      0%, 100% { transform: translateY(0); opacity: 0.7; }
      50%      { transform: translateY(6px); opacity: 1; }
    }

    /* Links grid */
    .links-section {
      position: relative; z-index: 1;
      padding: 40px 20px 80px;
      max-width: 720px;
      margin: 0 auto;
    }
    .section-title {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 600;
      color: var(--ink); margin-bottom: 6px;
    }
    .section-sub {
      text-align: center;
      font-size: 13px; color: var(--ink-soft);
      letter-spacing: 0.4px; margin-bottom: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 18px; } }

    .card {
      position: relative;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(196,168,140,0.35);
      border-radius: 22px;
      padding: 22px 16px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      text-decoration: none; color: var(--ink);
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.4), box-shadow 0.3s ease, border-color 0.3s ease;
      box-shadow: var(--shadow-sm);
      transform-style: preserve-3d;
      will-change: transform;
      overflow: hidden;
      opacity: 0;
      animation: rise 0.7s cubic-bezier(0.2,0.9,0.3,1.05) forwards;
    }
    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.12s; }
    .card:nth-child(3) { animation-delay: 0.19s; }
    .card:nth-child(4) { animation-delay: 0.26s; }
    .card:nth-child(5) { animation-delay: 0.33s; }
    .card:nth-child(6) { animation-delay: 0.40s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(196,168,140,0.15) 70%, rgba(196,168,140,0.35) 100%);
      opacity: 0; transition: opacity 0.3s ease;
      border-radius: inherit;
    }
    .card:hover { transform: translateY(-6px) rotateX(4deg); box-shadow: var(--shadow-lg); border-color: var(--gold); }
    .card:hover::before { opacity: 1; }
    .card:active { transform: translateY(-2px) scale(0.98); }

    .card-icon {
      width: 54px; height: 54px; border-radius: 16px;
      background: linear-gradient(145deg, var(--gold-soft) 0%, var(--gold) 100%);
      display: grid; place-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 6px 14px -4px rgba(168,136,101,0.5);
      transform: translateZ(20px);
      transition: transform 0.4s ease;
    }
    .card:hover .card-icon { transform: translateZ(30px) rotate(-6deg) scale(1.05); }
    .card-icon svg { width: 26px; height: 26px; fill: none; stroke: var(--white); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .card-label {
      font-family: 'Playfair Display', serif;
      font-weight: 600; font-size: 15px; letter-spacing: 0.3px;
      color: var(--ink);
      text-align: center;
      transform: translateZ(10px);
    }
    .card-sub {
      font-size: 11px; color: var(--ink-soft);
      letter-spacing: 0.6px; text-transform: uppercase;
      transform: translateZ(5px);
    }

    /* Footer */
    footer {
      text-align: center; padding: 20px 24px 32px;
      font-size: 12px; color: var(--ink-soft); letter-spacing: 0.8px;
      position: relative; z-index: 1;
    }
    footer .divider {
      width: 40px; height: 1px; background: var(--gold);
      margin: 0 auto 14px;
    }

    /* Loading shimmer */
    .card.loading {
      pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,0.6) 0%, rgba(230,214,194,0.4) 50%, rgba(255,255,255,0.6) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .card.loading .card-icon, .card.loading .card-label, .card.loading .card-sub { visibility: hidden; }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: var(--ivory);
      padding: 12px 20px; border-radius: 999px;
      font-size: 13px; letter-spacing: 0.4px;
      box-shadow: var(--shadow-md);
      opacity: 0; pointer-events: none;
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <!-- Top bar -->
  <div class="topbar">
    <div class="brand-mini">
      <img src="logo.png" alt="Iminationz" />
      <span>Iminationz</span>
    </div>
    <button id="soundToggle" class="icon-btn" aria-label="Toggle sound" title="Toggle sound">
      <svg id="iconSoundOff" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      <svg id="iconSoundOn" viewBox="0 0 24 24" style="display:none"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    </button>
  </div>

  <!-- Hero -->
  <section class="hero">
    <div class="logo-stage" id="logoStage">
      <div class="ring r2"></div>
      <div class="ring r1"></div>
      <div class="logo-card">
        <img src="logo.png" alt="Iminationz logo" draggable="false" />
      </div>
    </div>

    <div class="tagline">
      <h1 class="brand-name">Imination<span class="accent">z</span></h1>
      <p class="tag">Wear Elegance<span class="dot">·</span>Share Kindness</p>
    </div>

    <div class="scroll-hint">
      Explore
      <svg width="20" height="24" viewBox="0 0 20 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 4v14M4 12l6 6 6-6"/>
      </svg>
    </div>
  </section>

  <!-- Links -->
  <section class="links-section">
    <h2 class="section-title">Step Into Our World</h2>
    <p class="section-sub">Tap to explore · scan · shop</p>

    <div class="grid" id="grid">
      <!-- Populated by JS from Supabase config -->
    </div>
  </section>

  <footer>
    <div class="divider"></div>
    &copy; <span id="year"></span> Iminationz — Handcrafted with kindness
  </footer>

  <div id="toast" class="toast"></div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script>
    // ---- Config -----------------------------------------------------
    const SUPABASE_URL  = "https://ymktywuhhziuomoshbce.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlta3R5d3VoaHppdW9tb3NoYmNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMDQ1MDAsImV4cCI6MjA5Nzg4MDUwMH0.VcYlsdI3iWmGi2wT023wz0pfacnpPAVNgtOgG_ofa5A";

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { persistSession: false }
    });

    // Fallback defaults (used until Supabase responds, or if it fails)
    const DEFAULTS = {
      instagram_url:         "https://instagram.com/iminationz",
      store_location_url:    "https://maps.google.com/?q=Iminationz",
      whatsapp_community_url:"https://chat.whatsapp.com/",
      upi_url:               "upi://pay?pa=iminationz@upi&pn=Iminationz&cu=INR",
      shop_via_dm_url:       "https://ig.me/m/iminationz",
      latest_collection_url: "https://instagram.com/iminationz",
    };

    // Card catalog — order determines display order
    const CARDS = [
      {
        key: "instagram_url",
        label: "Instagram",
        sub: "@iminationz",
        icon: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/>',
        testid: "link-instagram",
      },
      {
        key: "store_location_url",
        label: "Visit Store",
        sub: "Find us",
        icon: '<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
        testid: "link-location",
      },
      {
        key: "whatsapp_community_url",
        label: "WhatsApp",
        sub: "Community",
        icon: '<path d="M20.5 3.5A11.5 11.5 0 0 0 3.6 19.8L2.5 24l4.4-1.1A11.5 11.5 0 1 0 20.5 3.5z"/><path d="M8.5 9.5c.4-.4 1.1-.4 1.5 0l.9 1.5c.2.3.1.7-.2 1l-.8.6c1 1.5 2 2.5 3.5 3.5l.6-.8c.3-.3.7-.4 1-.2l1.5.9c.4.2.5.9 0 1.5-.6.7-1.6 1.5-3 1-2.5-.9-4.7-3-5.6-5.6-.5-1.3.3-2.4 1-3z" fill="currentColor" stroke="none"/>',
        testid: "link-whatsapp",
      },
      {
        key: "upi_url",
        label: "UPI Payment",
        sub: "Pay in-store",
        icon: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h3"/>',
        testid: "link-upi",
      },
      {
        key: "shop_via_dm_url",
        label: "Shop via DM",
        sub: "Instagram",
        icon: '<path d="M21 12a9 9 0 1 1-3.6-7.2L21 3v6h-6"/><path d="M8 12h8M12 8v8" stroke-width="1.5"/>',
        testid: "link-shop-dm",
      },
      {
        key: "latest_collection_url",
        label: "New Drop",
        sub: "Latest collection",
        icon: '<path d="M12 2l2.4 6.4L21 9l-5 4.5L17.5 21 12 17l-5.5 4L8 13.5 3 9l6.6-.6z"/>',
        testid: "link-new-drop",
      },
    ];

    // ---- Render ------------------------------------------------------
    const grid = document.getElementById("grid");

    function iconSvg(inner) {
      return `<svg viewBox="0 0 24 24">${inner}</svg>`;
    }

    // Initial render with defaults (avoids blank page)
    function renderCards(cfg) {
      grid.innerHTML = "";
      CARDS.forEach(c => {
        const href = cfg[c.key] || DEFAULTS[c.key];
        const a = document.createElement("a");
        a.className = "card";
        a.href = href;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.setAttribute("data-testid", c.testid);
        a.innerHTML = `
          <div class="card-icon">${iconSvg(c.icon)}</div>
          <div class="card-label">${c.label}</div>
          <div class="card-sub">${c.sub}</div>
        `;
        a.addEventListener("click", (e) => {
          playSparkle();
          // tiny 3D press
          a.animate(
            [{ transform: "translateY(-2px) scale(0.98)" }, { transform: "translateY(-6px) scale(1)" }],
            { duration: 260, easing: "cubic-bezier(0.2,0.9,0.3,1.4)" }
          );
        });
        grid.appendChild(a);
      });
    }

    renderCards(DEFAULTS);

    async function loadConfig() {
      try {
        const { data, error } = await sb.from("landing_config").select("key,value");
        if (error) throw error;
        const cfg = { ...DEFAULTS };
        (data || []).forEach(row => { if (row.value) cfg[row.key] = row.value; });
        renderCards(cfg);
      } catch (err) {
        console.warn("[landing] Falling back to default links —", err.message);
        showToast("Using default links");
      }
    }
    loadConfig();

    document.getElementById("year").textContent = new Date().getFullYear();

    // ---- 3D interactive logo -----------------------------------------
    const stage = document.getElementById("logoStage");
    let targetRX = 0, targetRY = 0, curRX = 0, curRY = 0;

    function setTilt(x, y) {
      // x, y in [-0.5, 0.5]
      targetRY = x * 20;   // left/right → rotateY
      targetRX = -y * 20;  // up/down    → rotateX
    }

    document.addEventListener("mousemove", (e) => {
      const x = e.clientX / window.innerWidth - 0.5;
      const y = e.clientY / window.innerHeight - 0.5;
      setTilt(x, y);
    });

    // Gyroscope on mobile (asked on first tap)
    let orientationOn = false;
    function enableOrientation() {
      if (orientationOn) return;
      const start = () => {
        window.addEventListener("deviceorientation", (e) => {
          const gamma = (e.gamma || 0) / 45;  // -1..1
          const beta  = ((e.beta || 0) - 45) / 45;
          setTilt(Math.max(-0.5, Math.min(0.5, gamma * 0.5)),
                  Math.max(-0.5, Math.min(0.5, beta  * 0.5)));
        });
        orientationOn = true;
      };
      // iOS 13+ needs explicit permission
      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission().then(s => { if (s === "granted") start(); }).catch(()=>{});
      } else {
        start();
      }
    }

    function tick() {
      curRX += (targetRX - curRX) * 0.08;
      curRY += (targetRY - curRY) * 0.08;
      stage.style.transform = `rotateX(${curRX}deg) rotateY(${curRY}deg)`;
      requestAnimationFrame(tick);
    }
    tick();

    // Card 3D tilt on hover (desktop)
    document.addEventListener("mousemove", (e) => {
      document.querySelectorAll(".card").forEach(card => {
        const r = card.getBoundingClientRect();
        if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) {
          card.style.setProperty("--rx", "0deg");
          card.style.setProperty("--ry", "0deg");
          return;
        }
        const px = (e.clientX - r.left) / r.width - 0.5;
        const py = (e.clientY - r.top)  / r.height - 0.5;
        card.style.transform = `translateY(-6px) rotateX(${-py*10}deg) rotateY(${px*10}deg)`;
      });
    });
    document.addEventListener("mouseleave", () => {
      document.querySelectorAll(".card").forEach(c => c.style.transform = "");
    });

    // ---- Particles ---------------------------------------------------
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let W, H, dots;
    function resize() {
      W = canvas.width  = window.innerWidth  * devicePixelRatio;
      H = canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width  = window.innerWidth  + "px";
      canvas.style.height = window.innerHeight + "px";
    }
    resize();
    window.addEventListener("resize", resize);

    function initDots() {
      const n = Math.floor((window.innerWidth * window.innerHeight) / 22000);
      dots = Array.from({ length: n }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: (Math.random() * 1.6 + 0.4) * devicePixelRatio,
        vx: (Math.random() - 0.5) * 0.15 * devicePixelRatio,
        vy: (Math.random() - 0.5) * 0.15 * devicePixelRatio,
        a: Math.random() * 0.5 + 0.15,
      }));
    }
    initDots();
    window.addEventListener("resize", initDots);

    function drawDots() {
      ctx.clearRect(0, 0, W, H);
      dots.forEach(d => {
        d.x += d.vx; d.y += d.vy;
        if (d.x < 0) d.x = W; if (d.x > W) d.x = 0;
        if (d.y < 0) d.y = H; if (d.y > H) d.y = 0;
        const grd = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r * 4);
        grd.addColorStop(0, `rgba(196,168,140,${d.a})`);
        grd.addColorStop(1, "rgba(196,168,140,0)");
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r * 4, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(drawDots);
    }
    drawDots();

    // ---- Web Audio: ambient pad + sparkle ---------------------------
    let audioCtx = null;
    let padGain  = null;
    let soundOn  = false;

    function ensureAudio() {
      if (audioCtx) return audioCtx;
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      return audioCtx;
    }

    function startAmbientPad() {
      const ctx = ensureAudio();
      if (padGain) return;
      padGain = ctx.createGain();
      padGain.gain.value = 0;
      padGain.connect(ctx.destination);

      // Slow-attack gain envelope
      padGain.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 3);

      const notes = [220, 277.18, 329.63, 440]; // A3, C#4, E4, A4 — Amaj triad + octave
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = i % 2 === 0 ? "sine" : "triangle";
        osc.frequency.value = freq;

        // slow detune wobble
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.frequency.value = 0.15 + i * 0.07;
        lfoGain.gain.value  = 1.2;
        lfo.connect(lfoGain).connect(osc.detune);
        lfo.start();

        const noteGain = ctx.createGain();
        noteGain.gain.value = 0.22 / notes.length;

        // gentle lowpass
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 900 + i * 200;
        filter.Q.value = 0.6;

        osc.connect(filter).connect(noteGain).connect(padGain);
        osc.start();
      });
    }

    function stopAmbientPad() {
      if (!padGain || !audioCtx) return;
      padGain.gain.cancelScheduledValues(audioCtx.currentTime);
      padGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
    }

    function playSparkle() {
      if (!soundOn) return;
      const ctx = ensureAudio();
      const t = ctx.currentTime;
      // three quick high-frequency tones = shimmer
      [1760, 2637, 3520].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const g   = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, t + i * 0.03);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.2, t + i * 0.03 + 0.25);
        g.gain.setValueAtTime(0.0001, t + i * 0.03);
        g.gain.exponentialRampToValueAtTime(0.14, t + i * 0.03 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.03 + 0.35);
        osc.connect(g).connect(ctx.destination);
        osc.start(t + i * 0.03);
        osc.stop(t + i * 0.03 + 0.4);
      });
    }

    // Sound toggle
    const soundBtn = document.getElementById("soundToggle");
    const iconOn   = document.getElementById("iconSoundOn");
    const iconOff  = document.getElementById("iconSoundOff");

    function setSound(on) {
      soundOn = on;
      iconOn.style.display  = on ? "block" : "none";
      iconOff.style.display = on ? "none"  : "block";
      if (on) {
        const ctx = ensureAudio();
        if (ctx.state === "suspended") ctx.resume();
        startAmbientPad();
        showToast("Sound on");
      } else {
        stopAmbientPad();
        showToast("Sound off");
      }
      try { localStorage.setItem("iz_sound", on ? "1" : "0"); } catch(_){}
    }

    soundBtn.addEventListener("click", () => setSound(!soundOn));

    // First-tap: enable audio + orientation (mobile autoplay restriction)
    let firstTapDone = false;
    function firstTap() {
      if (firstTapDone) return;
      firstTapDone = true;
      enableOrientation();
      // Respect previous preference; default = on (subtle)
      const stored = (()=>{ try { return localStorage.getItem("iz_sound"); } catch(_){ return null; } })();
      setSound(stored === null ? true : stored === "1");
    }
    document.addEventListener("pointerdown", firstTap, { once: true });
    document.addEventListener("keydown",     firstTap, { once: true });

    // Toast
    let toastT;
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastT);
      toastT = setTimeout(() => el.classList.remove("show"), 1800);
    }
  </script>
</body>
</html>
